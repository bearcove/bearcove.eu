name: Website

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'templates/**'
      - 'sass/**'
      - 'static/**'
      - '.config/dodeca.styx'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Straight from the GitHub release: the installer's bucket
      # (bearcove-dist) no longer serves dodeca.
      - name: Install dodeca
        run: |
          mkdir -p ~/.cargo/bin
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/bearcove/dodeca/releases/download/v0.17.0/dodeca-x86_64-unknown-linux-gnu.tar.xz | tar xJ -C ~/.cargo/bin

      - name: Build website
        run: ~/.cargo/bin/ddc build

      - name: Copy CNAME to output
        run: cp CNAME public/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
