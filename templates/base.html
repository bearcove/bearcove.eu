<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}bearcove{% endblock title %}</title><meta name="description" content="bearcove is a European software company. Applied research, programming languages, speech recognition and software engineering."><link rel="stylesheet" href="/main.css"><script src="/site.js" defer></script><link rel="icon" type="image/jxl" href="/favicon.jxl"></head>
<body class="{% block body_class %}{% endblock body_class %}">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header"><a class="brand" href="/" aria-label="bearcove home">bearcove</a><nav aria-label="Main"><a href="/research/"{% if page is defined %}{% if page.extra.key == "research" %} aria-current="page"{% endif %}{% endif %}>Research</a><a href="/products/"{% if page is defined %}{% if page.extra.key == "products" %} aria-current="page"{% endif %}{% endif %}>Products</a><a href="/publishing/"{% if page is defined %}{% if page.extra.key == "publishing" %} aria-current="page"{% endif %}{% endif %}>Publishing</a><a href="/company/"{% if page is defined %}{% if page.extra.key == "company" %} aria-current="page"{% endif %}{% endif %}>Company</a></nav></header>
<main id="main" class="{% block main_class %}interior{% endblock main_class %}">{% block content %}{% endblock content %}</main>
<footer class="site-footer"><span>© 2024–2026 bearcove SARL</span><nav aria-label="Footer"><a href="/legal/">Legal notice</a><a href="mailto:hi@bearcove.eu">hi@bearcove.eu</a><a href="https://github.com/bearcove">GitHub</a></nav></footer>
<div class="sr-only" role="status" id="copy-status" aria-live="polite"></div>
</body>
</html>
